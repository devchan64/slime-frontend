<html lang="ko"><meta charset="utf-8"><title>SLIME · 네 맵 탐색 미리보기</title><style>body{margin:0;background:#0d1d28;color:#e5fff7;font:14px sans-serif}header{padding:14px;text-align:center}button{padding:8px;margin:4px}#game{width:100%;max-width:1100px;margin:auto}#result{padding:8px} .preview-tools{display:block;padding:14px;text-align:center}.preview-tools button,.preview-tools select{display:inline-block;width:auto;white-space:nowrap;margin:4px}.preview-tools #result{display:block}</style><header class="preview-tools">네 맵 탐색 · 목적지별 웨이포인트<br><select id="map-choice" style="padding:8px"><option value="meadow">이슬 초원</option><option value="grove">푸른 숲</option><option value="mist-lake">안개 호수</option><option value="wind-hills">바람 구릉</option></select><button id="zoom-out">최소 줌 0.4</button><button id="zoom-in">최대 줌 1.4</button><button id="character-settings">캐릭터 설정</button><button id="refresh">상태 갱신</button><div id="result">준비 중</div></header><div id="game"></div><div id="settings-root"></div><script type="module">
import {createGame} from '/src/game/createGame.ts';
import { h, render } from 'preact';
import { CharacterSettingsDialog } from '/src/ui/CharacterSettingsDialog.tsx';
import '/src/styles.css';
const settingsRoot = document.querySelector('#settings-root');
document.querySelector('#character-settings').onclick = () => render(h(CharacterSettingsDialog, {
  me: {name:'모험가 · 미리보기 (분배 비활성)',cp:10,attributes:{body:1,intellect:1,spirit:1},mode:'FIELD',battleId:null},
  disabled:true, command:()=>{}, onClose:()=>render(null, settingsRoot)
}), settingsRoot);
const {game,scene}=createGame(document.querySelector('#game'),()=>{},()=>{});
const maps={"meadow": {"id": "meadow", "name": "이슬 초원", "version": "1.3.0", "columns": 32, "rows": 32, "startPoint": {"column": 2, "row": 2}, "safeRadius": 3, "blocked": [{"column": 12, "row": 6}, {"column": 12, "row": 7}, {"column": 12, "row": 8}, {"column": 12, "row": 9}, {"column": 12, "row": 11}, {"column": 12, "row": 12}, {"column": 12, "row": 13}, {"column": 12, "row": 14}], "connections": [{"id": "gate", "name": "서쪽 웨이포인트", "column": 0, "row": 2, "target": "grove", "direction": "west", "targetWaypointId": "gate-east", "targetName": "푸른 숲"}, {"id": "gate-east", "name": "동쪽 웨이포인트", "column": 31, "row": 16, "target": "mist-lake", "direction": "east", "targetWaypointId": "gate", "targetName": "안개 호수"}, {"id": "gate-south", "name": "남쪽 웨이포인트", "column": 16, "row": 31, "target": "wind-hills", "direction": "south", "targetWaypointId": "gate-north", "targetName": "바람 구릉"}]}, "grove": {"id": "grove", "name": "푸른 숲", "version": "1.3.0", "columns": 32, "rows": 32, "startPoint": {"column": 2, "row": 2}, "safeRadius": 3, "blocked": [{"column": 12, "row": 6}, {"column": 12, "row": 7}, {"column": 12, "row": 8}, {"column": 12, "row": 9}, {"column": 12, "row": 11}, {"column": 12, "row": 12}, {"column": 12, "row": 13}, {"column": 12, "row": 14}], "connections": [{"id": "gate-east", "name": "동쪽 웨이포인트", "column": 31, "row": 2, "target": "meadow", "direction": "east", "targetWaypointId": "gate", "targetName": "이슬 초원"}]}, "mist-lake": {"id": "mist-lake", "name": "안개 호수", "version": "1.3.0", "columns": 32, "rows": 32, "startPoint": {"column": 2, "row": 2}, "safeRadius": 3, "blocked": [{"column": 20, "row": 8}, {"column": 21, "row": 8}, {"column": 22, "row": 8}, {"column": 19, "row": 9}, {"column": 20, "row": 9}, {"column": 21, "row": 9}, {"column": 22, "row": 9}, {"column": 23, "row": 9}, {"column": 18, "row": 10}, {"column": 19, "row": 10}, {"column": 20, "row": 10}, {"column": 21, "row": 10}, {"column": 22, "row": 10}, {"column": 23, "row": 10}, {"column": 24, "row": 10}, {"column": 18, "row": 11}, {"column": 19, "row": 11}, {"column": 20, "row": 11}, {"column": 21, "row": 11}, {"column": 22, "row": 11}, {"column": 23, "row": 11}, {"column": 24, "row": 11}, {"column": 18, "row": 12}, {"column": 19, "row": 12}, {"column": 20, "row": 12}, {"column": 21, "row": 12}, {"column": 22, "row": 12}, {"column": 23, "row": 12}, {"column": 24, "row": 12}, {"column": 19, "row": 13}, {"column": 20, "row": 13}, {"column": 21, "row": 13}, {"column": 22, "row": 13}, {"column": 23, "row": 13}, {"column": 20, "row": 14}, {"column": 21, "row": 14}, {"column": 22, "row": 14}], "connections": [{"id": "gate", "name": "서쪽 웨이포인트", "column": 0, "row": 16, "target": "meadow", "direction": "west", "targetWaypointId": "gate-east", "targetName": "이슬 초원"}]}, "wind-hills": {"id": "wind-hills", "name": "바람 구릉", "version": "1.3.0", "columns": 32, "rows": 32, "startPoint": {"column": 2, "row": 2}, "safeRadius": 3, "blocked": [{"column": 9, "row": 18}, {"column": 10, "row": 18}, {"column": 10, "row": 19}, {"column": 11, "row": 19}, {"column": 22, "row": 22}, {"column": 23, "row": 22}, {"column": 23, "row": 23}], "connections": [{"id": "gate-north", "name": "북쪽 웨이포인트", "column": 16, "row": 0, "target": "meadow", "direction": "north", "targetWaypointId": "gate-south", "targetName": "이슬 초원"}]}};
let map=maps.meadow;
const state={location:{id:"preview-meadow",kind:"FIELD",mapId:"meadow",chatRoomId:"preview",roomReady:true},map,battle:null,me:{id:'preview',position:{column:16,row:16}},members:[{id:"preview", name:"모험가 · 5등신", position:{column:16,row:16},mode:"FIELD"}],monsters:[{id:"preview-passive",name:"슬라임 · 사람의 1/3",appearance:"slime",heightRatio:1/3,position:{column:18,row:16},disposition:"PASSIVE",state:"AVAILABLE"},{id:"preview-aggro",name:"숲 짐승 · 사람의 1.5배",appearance:"beast",heightRatio:1.5,position:{column:22,row:18},disposition:"AGGRESSIVE",state:"AVAILABLE"},{id:"preview-strong",name:"고목 거인 · 사람의 5배",appearance:"giant",heightRatio:5,position:{column:25,row:10},disposition:"PASSIVE",state:"AVAILABLE"}]};
function zoom(z){scene.cameras.main.setZoom(z);scene.cameras.main.centerOn(1040,z===.4?560:144);}
document.querySelector('#map-choice').onchange=e=>{map=maps[e.target.value];state.map=map;state.location={id:'preview-'+map.id,kind:'FIELD',mapId:map.id,chatRoomId:'preview',roomReady:true};state.me.position={...map.startPoint};scene.setState(state);zoom(.4);};
document.querySelector('#zoom-out').onclick=()=>zoom(.4);
document.querySelector('#zoom-in').onclick=()=>zoom(1.4);
document.querySelector('#refresh').onclick=()=>scene.setState(state);
const timer=setInterval(()=>{if(scene.sys.isActive()&&scene.textures.exists('meadow-terrain')){clearInterval(timer);scene.setState(state);zoom(.4);game.events.on('poststep',()=>{const markers=scene.children.list.filter(c=>c.type==='Container'&&c.depth===100);const widths=markers.map(m=>(32*m.scaleX*scene.cameras.main.zoom).toFixed(2));document.querySelector('#result').textContent=`줌 ${scene.cameras.main.zoom.toFixed(1)} · 웨이포인트 ${markers.length}개 · 배지 지름 ${widths.join(' / ')}px`;});}},50);
</script></html>
