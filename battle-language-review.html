<!doctype html><html><head><meta charset="utf-8"><title>전투 언어 검수</title></head><body><button id="ko">한국어</button><button id="en">English</button><p id="result">No command</p><main id="app"></main><script type="module">
import {h,render} from 'preact';
import {BattlePanel} from '/src/ui/BattlePanel';
import {setLocale} from '/src/i18n';
import fixtures from '/src/dev/battlefield-fixtures.json';
import '/src/styles.css';
const state=structuredClone(fixtures[0]),battle=state.battle;
battle.units[0].ap=3;battle.units[0].maxAp=6;
for(const [i,u] of battle.units.filter(u=>u.side==='enemy').entries())u.nameTranslations={ko:`슬라임 ${i+1}`,en:`Slime ${i+1}`};
battle.log=[{unitId:state.me.id,action:'ATTACK',targetId:battle.units.find(u=>u.side==='enemy').id,damage:2,turnId:1,at:100}];
let selected=null;function draw(){render(h(BattlePanel,{battle,actor:state.me.id,selected,disabled:false,remaining:30,select:p=>{if(selected?.column===p?.column&&selected?.row===p?.row)return;selected=p;queueMicrotask(draw)},execute:type=>{document.querySelector('#result').textContent=type}}),document.querySelector('#app'))}
for(const lang of ['ko','en'])document.querySelector('#'+lang).onclick=()=>{setLocale(lang);draw()};setLocale('en');draw();
</script></body></html>
