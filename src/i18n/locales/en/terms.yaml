title: "Terms of Use"
backToMenu: "Back to menu"
pendingNotice: "Advance notice: These clauses cover issue reports, incident record retention, and game data loss. Incident recording and issue reporting are not yet available. We will announce when these clauses take effect."
reportHeading: "Reporting deadline"
reportPolicy: "If you notice an issue with an action result, an item, or currency while using the service, please report it within one week of discovering it so that we can review the records and help you."
reportDetails: "Include your adventurer information, when you noticed the issue, when you believe it occurred, and a description of what happened."
retentionHeading: "Incident record retention"
retentionPolicy: "Records of user actions and their results are retained for no more than 14 days from the time of the incident, then deleted."
supportLimits: "Even if you report within the deadline, investigation and assistance may be limited if records have already been deleted or there is insufficient information. Reporting does not extend record retention and does not guarantee restoration or compensation."
dataLossHeading: "Game data loss due to disasters"
dataLossPolicy: "Game data may be lost due to natural disasters or other circumstances that the service operator cannot reasonably prevent or respond to. In such circumstances, we cannot guarantee the prevention of data loss or the restoration of lost data."
operationHeading: "Free service and character creation"
operationPolicy: "To provide the game free of charge, we follow a low-cost operating policy and support the creation of only one character per person."
connectionLimitHeading: "Concurrent player limit"
connectionLimitPolicy: "To keep the game stable, we may limit the number of concurrent players. New connections may be restricted when the service is full. Please try again when capacity becomes available. The limit may be adjusted according to operating conditions."
seasonLoginHeading: "Daily seasonal login reward"
seasonLoginPolicy: "Once a season begins, your first login each day during the season earns 1 CP and 1 SP as a seasonal achievement reward. Days follow Korea Standard Time. Additional logins on the same day do not earn another reward."
currentSeason: "The current season is Season 0 · Test Season. The same daily login reward policy applies."
