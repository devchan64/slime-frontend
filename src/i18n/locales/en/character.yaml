rules: "You start with 10 CP and 0 SP, with Literacy, Speaking and Physical Activity at level 1. Attribute upgrades share a CP cost sequence and each skill has its own SP sequence: 1 → 2 → 3 → 4 → … → 100 over the first 20 steps, then 110 → 121 → 132 and onward. Granted levels do not increase costs, so the first skill upgrade from level 1 to 2 costs 1 SP. Skills earned through achievements start at level 0. Previously granted levels are preserved. Allocations cannot be undone."
