title: "사용약관"
backToMenu: "메뉴로 돌아가기"
pendingNotice: "시행 전 안내: 아래는 이상 신고, 사건기록 보관 및 게임 데이터 손실에 관한 조항입니다. 사건기록 서비스와 신고 기능은 아직 제공되지 않으며, 적용 시 별도로 안내합니다."
reportHeading: "이상 신고 기한"
reportPolicy: "서비스 이용 중 행동 결과, 아이템, 재화 등에 이상을 확인한 경우, 이상을 확인한 시점부터 1주일 이내에 신고해 주셔야 기록을 바탕으로 확인 및 도움을 드릴 수 있습니다."
reportDetails: "신고 시 모험가 정보, 이상을 확인한 시각, 추정 발생 시각과 구체적인 내용을 함께 알려 주세요."
retentionHeading: "사건기록 보관"
retentionPolicy: "사용자 행동과 결과에 관한 사건기록은 사건 발생 시점부터 최대 14일간 보관한 뒤 삭제합니다."
supportLimits: "기한 내에 신고하더라도 발생 후 시간이 지나 기록이 이미 삭제되었거나 확인 자료가 부족한 경우에는 조사와 지원이 제한될 수 있습니다. 신고 접수로 기록 보관 기간이 연장되지 않으며, 신고 접수 자체가 복구 또는 보상을 보장하지는 않습니다."
dataLossHeading: "재해 등에 따른 게임 데이터 손실"
dataLossPolicy: "천재지변 등 서비스 운영자가 합리적으로 예방하거나 대응하기 어려운 상황에서는 게임 데이터가 손실될 수 있으며, 이러한 상황에서 데이터 손실 방지나 손실된 데이터의 복구를 보장할 수 없습니다."
operationHeading: "무료 서비스와 캐릭터 생성"
operationPolicy: "게임을 무료로 제공하기 위해 저비용 운영 정책을 적용하고 있으며, 이용자 1인당 캐릭터 1개 생성만 지원합니다."
connectionLimitHeading: "동시 접속자 수 제한"
connectionLimitPolicy: "게임의 안정적인 운영을 위해 동시 접속자 수를 제한할 수 있습니다. 접속 정원이 찬 경우 신규 접속이 제한될 수 있으며, 여유가 생긴 뒤 다시 접속을 시도해 주세요. 접속 상한은 서비스 운영 상황에 따라 조정될 수 있습니다."
